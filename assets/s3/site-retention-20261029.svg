<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
<title id="title">사이트 첫 방문 코호트의 4주 리텐션, 참고 지표</title><desc id="desc">8월 25일부터 9월 26일까지 첫 방문한 동일한 40명을 추적한다. W0 40명, W1 3명, W2 2명, W3 1명, W4 0명. 공고 열람 사용자 기준 리텐션과 다르다.</desc>
